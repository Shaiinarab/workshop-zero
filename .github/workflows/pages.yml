name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install node deps
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc -p tsconfig.json

      - name: Go build and test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: htmx upgrade check
        run: npx --yes htmx.org@4.0.0 upgrade-check -- ./web/templates

      - name: Freeze static snapshot
        run: go run ./cmd/server freeze dist

      - name: Assert no external runtime URLs
        run: |
          bad=$(grep -rnoE '(src|href)="https?://[^"]+' dist --include='*.html' --include='*.css' \
                 | grep -v '127.0.0.1' | grep -v 'localhost' || true)
          if [ -n "$bad" ]; then
            echo "$bad"; echo "::error::external runtime URL found"; exit 1
          fi

      - name: Publish dist to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(git rev-parse --short HEAD)"
          git push -q --force https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}