name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install node deps
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.json

      - name: Freeze static snapshot
        run: go run ./cmd/server freeze dist

      - name: Assert no external runtime requests
        run: |
          bad=$(grep -rnoE '(src|href)="https?://[^"]+' dist --include='*.html' --include='*.css' \
                 | grep -v '127.0.0.1' | grep -v 'localhost' || true)
          if [ -n "$bad" ]; then
            echo "$bad"; echo "::error::external runtime URL found"; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4