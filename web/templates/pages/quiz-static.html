{{template "layouts/base_top" .}}
<nav class="crumbs"><a href="/">خانه</a> / آزمون مسیر</nav>
<header style="max-width:56ch">
  <h1>آزمون مسیر</h1>
  <p class="muted">{{faNum .Total}} سؤال کوتاه. این نسخه آفلاین است و امتیازدهی در مرورگر انجام می‌شود.</p>
</header>
<div class="container narrow">
  <script type="application/json" id="quiz-data">{{.QuestionsJSON}}</script>
  <div id="static-quiz" data-static-quiz data-modules="{{.ModulesJSON}}">
    <noscript>
      <div class="card"><p>برای شرکت در آزمون به جاوااسکریپت نیاز است.</p></div>
    </noscript>
    <div class="card skeleton">در حال بارگذاری…</div>
  </div>
  <script type="module" src="/static/js/quiz-static.js"></script>
</div>
{{template "layouts/base_bottom" .}}
